services:
  fluxgate:
    image: ghcr.io/winds18/fluxgate:${FLUXGATE_IMAGE_TAG:-latest}
    container_name: fluxgate
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./logs/fluxgate:/app/logs
    ports:
      - "${FLUXGATE_HOST_BIND:-127.0.0.1}:${FLUXGATE_HTTP_PORT:-18080}:8080"
    depends_on:
      - sing-box
    networks:
      - fluxgate

  sing-box:
    image: ${SING_BOX_IMAGE:-fluxgate-sing-box:${FLUXGATE_IMAGE_TAG:-latest}}
    container_name: fluxgate-sing-box
    restart: unless-stopped
    volumes:
      - ./data/sing-box:/etc/sing-box
      - ./logs/sing-box:/var/log/sing-box
    command: run -D /var/lib/sing-box -c /etc/sing-box/config.json
    ports:
      - "8443:8443/tcp"
      - "8444:8444/tcp"
      - "8445:8445/tcp"
    networks:
      - fluxgate

networks:
  fluxgate:
    name: fluxgate
