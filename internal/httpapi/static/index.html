<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FluxGate</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>FluxGate</h1>
        <p>sing-box 数据面控制平台</p>
      </div>
      <div class="topbar-actions">
        <span id="status" class="status">连接中</span>
        <button id="logout" class="ghost-button" hidden>退出</button>
      </div>
    </header>

    <main id="login-view" class="login-view" hidden>
      <form id="login-form" class="login-panel">
        <h2>管理员登录</h2>
        <label>
          账号
          <input id="login-username" name="username" autocomplete="username" required />
        </label>
        <label>
          密码
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">登录</button>
        <div id="login-error" class="form-error" role="alert"></div>
      </form>
    </main>

    <main id="app-view" hidden>
      <section class="metrics" id="metrics"></section>

      <section class="panel">
        <div class="panel-header">
          <h2>上游来源</h2>
          <button id="refresh">刷新</button>
        </div>
        <div id="sources" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>节点池</h2>
        </div>
        <div id="nodes" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Token</h2>
        </div>
        <div id="tokens" class="table"></div>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
