<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FluxGate</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>FluxGate</h1>
        <p>sing-box 数据面控制平台</p>
      </div>
      <div class="topbar-actions">
        <span id="status" class="status">连接中</span>
        <button id="logout" class="ghost-button" hidden>退出</button>
      </div>
    </header>

    <main id="login-view" class="login-view" hidden>
      <form id="login-form" class="login-panel">
        <h2>管理员登录</h2>
        <label>
          账号
          <input id="login-username" name="username" autocomplete="username" required />
        </label>
        <label>
          密码
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">登录</button>
        <div id="login-error" class="form-error" role="alert"></div>
      </form>
    </main>

    <main id="app-view" hidden>
      <section class="metrics" id="metrics"></section>

      <section class="panel">
        <div class="panel-header">
          <h2>sing-box 配置</h2>
          <div class="button-row">
            <button id="config-check">检查配置</button>
            <button id="config-publish">发布配置</button>
            <button id="config-rollback">回滚配置</button>
            <button id="config-restart">重启服务</button>
          </div>
        </div>
        <div id="config-check-result" class="result-box" hidden></div>
      </section>

      <section class="workflow-grid">
        <form id="team-form" class="panel form-panel">
          <div class="panel-header">
            <h2>创建团队</h2>
          </div>
          <div class="form-body">
            <label>
              名称
              <input name="name" required />
            </label>
            <label>
              备注
              <input name="description" />
            </label>
            <button type="submit">创建</button>
          </div>
        </form>

        <form id="user-form" class="panel form-panel">
          <div class="panel-header">
            <h2>创建成员</h2>
          </div>
          <div class="form-body">
            <label>
              团队
              <select id="user-team" name="team_id"></select>
            </label>
            <label>
              姓名
              <input name="name" required />
            </label>
            <label>
              邮箱
              <input name="email" type="email" />
            </label>
            <button type="submit">创建</button>
          </div>
        </form>

        <form id="source-form" class="panel form-panel">
          <div class="panel-header">
            <h2>添加来源</h2>
          </div>
          <div class="form-body">
            <label>
              名称
              <input name="name" required />
            </label>
            <label>
              类型
              <select name="type">
                <option value="manual">manual</option>
                <option value="subscription">subscription</option>
              </select>
            </label>
            <label>
              URL
              <input name="url" type="url" />
            </label>
            <label>
              刷新间隔分钟
              <input name="refresh_interval_minutes" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              默认标签
              <input name="default_tags" placeholder="HK, Premium" />
            </label>
            <button type="submit">添加</button>
          </div>
        </form>

        <form id="node-import-form" class="panel form-panel span-2">
          <div class="panel-header">
            <h2>导入节点</h2>
          </div>
          <div class="form-body">
            <label>
              来源
              <select id="node-source" name="source_id" required></select>
            </label>
            <label>
              节点内容
              <textarea name="content" rows="3" required></textarea>
            </label>
            <button type="submit">导入</button>
          </div>
        </form>

        <form id="virtual-node-form" class="panel form-panel">
          <div class="panel-header">
            <h2>创建虚拟节点</h2>
          </div>
          <div class="form-body">
            <label>
              名称
              <input name="name" placeholder="FluxGate-HK" required />
            </label>
            <label>
              端口
              <input name="listen_port" type="number" min="1" max="65535" value="8443" required />
            </label>
            <label>
              上游标签选择器
              <input name="tag_selector" placeholder='{"include":["HK"]}' />
            </label>
            <button type="submit">创建</button>
          </div>
        </form>

        <form id="policy-form" class="panel form-panel">
          <div class="panel-header">
            <h2>创建策略</h2>
          </div>
          <div class="form-body">
            <label>
              名称
              <input name="name" required />
            </label>
            <label>
              范围
              <select name="scope_type">
                <option value="team">团队</option>
                <option value="user">成员</option>
                <option value="token">Token</option>
              </select>
            </label>
            <label>
              范围 ID
              <input name="scope_id" type="number" min="1" />
            </label>
            <label>
              最大节点数
              <input name="max_nodes" type="number" min="0" value="0" />
            </label>
            <label>
              允许虚拟节点
              <input name="allowed_virtual_nodes" placeholder="FluxGate-HK, FluxGate-SG" />
            </label>
            <label>
              包含标签
              <input name="include_tags" placeholder="HK, Premium" />
            </label>
            <label>
              排除标签
              <input name="exclude_tags" placeholder="Backup" />
            </label>
            <button type="submit">创建</button>
          </div>
        </form>

        <form id="token-form" class="panel form-panel span-2">
          <div class="panel-header">
            <h2>创建 Token</h2>
          </div>
          <div class="form-body token-form-grid">
            <label>
              成员
              <select id="token-user" name="user_id" required></select>
            </label>
            <label>
              名称
              <input name="name" />
            </label>
            <label>
              有效天数
              <input name="expire_days" type="number" min="0" value="30" />
            </label>
            <label>
              流量额度 MiB
              <input name="quota_mib" type="number" min="0" value="1024" />
            </label>
            <button type="submit">创建</button>
          </div>
          <div id="token-result" class="result-box" hidden></div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>上游来源</h2>
          <button id="refresh">刷新</button>
        </div>
        <div id="sources" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>节点池</h2>
        </div>
        <div id="nodes" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>团队</h2>
        </div>
        <div id="teams" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>成员</h2>
        </div>
        <div id="users" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>虚拟节点</h2>
        </div>
        <div id="virtual-nodes" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>策略</h2>
        </div>
        <div id="policies" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Token</h2>
        </div>
        <div id="tokens" class="table"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>流量统计</h2>
        </div>
        <div id="traffic-daily" class="traffic-chart"></div>
        <div id="traffic-tokens" class="table"></div>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
