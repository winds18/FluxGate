services:
  fluxgate:
    depends_on:
      - sub-store

  sub-store:
    image: xream/sub-store:${SUB_STORE_IMAGE_TAG:-latest}
    container_name: fluxgate-sub-store
    restart: unless-stopped
    volumes:
      - ./data/sub-store:/opt/app/data
    ports:
      - "${SUB_STORE_HOST_BIND:-127.0.0.1}:${SUB_STORE_HTTP_PORT:-3001}:3001"
    networks:
      - fluxgate
